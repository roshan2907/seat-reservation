services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: seats
      POSTGRES_USER: seats
      POSTGRES_PASSWORD: seats
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seats -d seats"]
      interval: 3s
      retries: 10

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/seats
      DB_USER: seats
      DB_PASSWORD: seats
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy