spring.application.name=seat-reservation
server.port=${PORT:8080}

# --- Database (env vars in Docker/prod, local defaults otherwise) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/seats}
spring.datasource.username=${DB_USER:seats}
spring.datasource.password=${DB_PASSWORD:seats}

# --- JPA: Flyway owns the schema, Hibernate only validates ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# --- Actuator: health probes + Prometheus ---
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.readiness.show-details=always
management.metrics.tags.application=seat-reservation

# --- JWT ---
# HS256 needs at least 32 bytes. Override JWT_SECRET in production.
app.jwt.secret=${JWT_SECRET:dev-secret-change-me-dev-secret-change-me-123456}
app.jwt.ttl-seconds=86400

# --- JSON: snake_case to match the spec (user_id, price_paise, ...) ---
spring.jackson.property-naming-strategy=SNAKE_CASE

# --- Concurrency / load ---
# Virtual threads: thousands of waiting requests cost almost nothing
spring.threads.virtual.enabled=true
# Keep pool within Postgres max_connections; requests queue for a connection instead of failing
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.connection-timeout=30000
# Never wait forever on a row lock; a timeout becomes 409 seat_contended
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '3s'