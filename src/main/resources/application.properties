spring.application.name=seat-reservation
server.port=${PORT:8080}

# --- Database (env vars in Docker/prod, local defaults otherwise) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/seats}
spring.datasource.username=${DB_USER:seats}
spring.datasource.password=${DB_PASSWORD:seats}

# --- JPA: Flyway owns the schema, Hibernate only validates ---
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# --- Actuator ---
management.endpoints.web.exposure.include=health